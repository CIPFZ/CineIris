<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#48484A" stroke-width="4"/>

  <!-- Iris aperture blades (6 blades) -->
  <g transform="translate(256,256)">
    <!-- Blade 1 -->
    <polygon points="-30,-180 30,-180 80,-80 -80,-80" fill="url(#accent)" opacity="0.9" transform="rotate(0)"/>
    <!-- Blade 2 -->
    <polygon points="-30,-180 30,-180 80,-80 -80,-80" fill="url(#accent)" opacity="0.9" transform="rotate(60)"/>
    <!-- Blade 3 -->
    <polygon points="-30,-180 30,-180 80,-80 -80,-80" fill="url(#accent)" opacity="0.9" transform="rotate(120)"/>
    <!-- Blade 4 -->
    <polygon points="-30,-180 30,-180 80,-80 -80,-80" fill="url(#accent)" opacity="0.9" transform="rotate(180)"/>
    <!-- Blade 5 -->
    <polygon points="-30,-180 30,-180 80,-80 -80,-80" fill="url(#accent)" opacity="0.9" transform="rotate(240)"/>
    <!-- Blade 6 -->
    <polygon points="-30,-180 30,-180 80,-80 -80,-80" fill="url(#accent)" opacity="0.9" transform="rotate(300)"/>

    <!-- Center hole -->
    <circle cx="0" cy="0" r="55" fill="#1C1C1E"/>
    <!-- Lens reflection -->
    <circle cx="-15" cy="-20" r="18" fill="white" opacity="0.15"/>
  </g>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#0A84FF" stroke-width="3"/>
</svg>